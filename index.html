<title>方言例字录音采集 44100Hz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"微软雅黑",sans-serif;}
body{max-width:900px;margin:20px auto;padding:0 20px;line-height:1.8;}
h2{text-align:center;margin-bottom:20px;color:#333;}
.page-info{text-align:center;font-size:18px;margin:10px 0;font-weight:bold;}
.word-box{border:1px solid #ccc;padding:20px;border-radius:8px;min-height:220px;margin:20px 0;font-size:20px;word-break:break-all;}

.volume-wrap{
  width: 100%;
  height: 24px;
  background: #eee;
  border-radius: 12px;
  overflow: hidden;
  margin: 10px 0;
  border: 1px solid #ddd;
}
.volume-bar{
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #2d8cf0, #42b983);
  transition: width 0.05s linear;
}

.status{text-align:center;margin:10px 0;font-size:16px;color:#666;}
.btn-group{text-align:center;margin:20px 0;}
button{padding:10px 20px;font-size:16px;margin:0 8px;cursor:pointer;border:none;border-radius:4px;background:#2d8cf0;color:#fff;}
button:disabled{background:#999;cursor:not-allowed;}
</style>
</head>
<body>

<h2>方言例字录音采集</h2>
<div class="page-info">当前页码：<span id="pageNum">01</span> / 20</div>

<div class="word-box" id="wordContainer"></div>

<div class="volume-wrap">
  <div class="volume-bar" id="volumeBar"></div>
</div>

<div class="status" id="status">就绪</div>

<div class="btn-group">
  <button id="prevBtn" disabled>上一页</button>
  <button id="startRec">开始录音</button>
  <button id="stopRec" disabled>结束并下载</button>
  <button id="nextBtn">下一页</button>
</div>

"形","壁","劈","踢","笛","历","锡","击","吃","横","划","兄","荣","永","营","蓬","东","懂","冻","通",
"桶","痛","铜","动","洞","聋","弄","粽","葱","送","公","孔","烘","红","翁","木","读","鹿","族","谷",
"哭","屋","冬","统","脓","松","宋","毒","风","丰","凤","梦","中","虫","终","充","宫","穷","熊","雄",
"福","服","目","六","宿","竹","畜","缩","粥","叔","熟","肉","菊","育","封","蜂","缝","浓","龙","松",
"重","肿","种","冲","恭","共","凶","拥","容","用","绿","足","烛","赎","属","褥","曲","局","玉","浴"
];

const PAGE_SIZE = 50;
const TOTAL_PAGE = 20;
let currentPage = 1;
let mediaRecorder = null;
let audioChunks = [];
let stream = null;
let audioContext = null;
let analyser = null;
let volumeBar = document.getElementById('volumeBar');
let rafId = null;

const wordContainer = document.getElementById('wordContainer');
const pageNumEl = document.getElementById('pageNum');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const startRec = document.getElementById('startRec');
const stopRec = document.getElementById('stopRec');
const statusEl = document.getElementById('status');

// 渲染页面文字
function renderPage(page) {
  const start = (page - 1) * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const pageWords = allWords.slice(start, end);
  wordContainer.innerText = pageWords.join("  ");
  pageNumEl.textContent = page.toString().padStart(2, '0');

  prevBtn.disabled = page <= 1;
  nextBtn.disabled = page >= TOTAL_PAGE;
}

// 重置音量条
function resetVolume() {
  volumeBar.style.width = "0%";
  if(rafId) cancelAnimationFrame(rafId);
}

// 实时音量可视化
function drawVolume() {
  if(!analyser) return;
  const dataArray = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(dataArray);
  let sum = 0;
  for(let val of dataArray) sum += val;
  let avg = sum / dataArray.length;
  let percent = Math.min(100, (avg / 128) * 100);
  volumeBar.style.width = percent + "%";
  rafId = requestAnimationFrame(drawVolume);
}

// 初始化页面
renderPage(currentPage);
resetVolume();

// 上一页
prevBtn.addEventListener('click', () => {
  if(currentPage > 1){
    currentPage--;
    renderPage(currentPage);
    statusEl.textContent = "就绪";
    resetVolume();
  }
});

// 下一页
nextBtn.addEventListener('click', () => {
  if(currentPage < TOTAL_PAGE){
    currentPage++;
    renderPage(currentPage);
    statusEl.textContent = "就绪";
    resetVolume();
  }
});

// 开始录音（固定 44100Hz）
startRec.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    resetVolume();

    // 强制设置采样率 44100 Hz
    if(!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)({
        sampleRate: 44100
      });
    }
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    const source = audioContext.createMediaStreamSource(stream);
    source.connect(analyser);
    drawVolume();

    mediaRecorder.ondataavailable = e => {
      if(e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/wav' });
      const url = URL.createObjectURL(blob);
      const fileName = currentPage.toString().padStart(2, '0') + ".wav";
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);

      stream.getTracks().forEach(track => track.stop());
      resetVolume();
      statusEl.textContent = `录音完成，已下载 ${fileName}`;
      startRec.disabled = false;
      stopRec.disabled = true;
    };

    mediaRecorder.start();
    statusEl.textContent = "正在录音...";
    startRec.disabled = true;
    stopRec.disabled = false;
  } catch (err) {
    statusEl.textContent = "麦克风权限被拒绝，请允许麦克风权限";
    console.error(err);
  }
});

// 停止录音
stopRec.addEventListener('click', () => {
  if(mediaRecorder && mediaRecorder.state === "recording"){
    mediaRecorder.stop();
  }
});
</script>
